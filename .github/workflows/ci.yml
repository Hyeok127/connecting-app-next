name: CI

# 이 저장소는 main push = 즉시 프로덕션 배포다(Vercel GitHub 연동).
# 그런데 그동안 lint·test·build가 어디서도 자동 실행되지 않았다 — 게이트가 0이었다.
# dev(Preview)와 main(Production) 양쪽, 그리고 PR에서 돌린다.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# 같은 브랜치에 연속 push하면 이전 실행을 취소한다(Actions 무료 분 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # CLAUDE.md 기준 Node를 22.22.2로 고정한다. 기기 간 lockfile 해석 차이를 만들지 않기 위해서다.
          node-version: 22.22.2
          cache: npm

      # package-lock.json 기준 설치 (pnpm/yarn 아님, npm 고정)
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 빌드는 환경변수 없이도 통과해야 한다 — getSupabase()가 지연 초기화라
      # 빌드 시점에 Supabase 자격증명을 요구하지 않는다. 여기서 깨지면 그 전제가 깨진 것이다.
      - name: Build
        run: npm run build

      # 스모크: 더미 Supabase 값으로 서버를 띄워 401/렌더링만 확인한다. 실데이터 무접촉.
      - name: Smoke
        run: bash scripts/smoke_run.sh

  # 마이그레이션 파일을 건드린 PR·push에 눈에 띄는 안내를 남긴다.
  # 코드 배포(git push → Vercel)와 스키마 변경(수동 Management API)은 서로를 모르는
  # 별개 파이프라인이라, "머지했으니 반영됐겠지"가 실제로 사고를 낸다.
  migrations-notice:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경된 마이그레이션 확인
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "기준 커밋을 알 수 없어 건너뜁니다."; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- supabase/migrations/ || true)
          if [ -z "$CHANGED" ]; then
            echo "마이그레이션 변경 없음."; exit 0
          fi
          echo "::warning title=마이그레이션 변경됨::아래 파일은 배포만으로 반영되지 않습니다. Supabase에 별도 적용이 필요합니다."
          echo "$CHANGED"
          echo ""
          echo "적용: node scripts/apply_migration.mjs <파일> .env.local.prod.bak"
          echo "확인: GET /api/health 의 migrations.pending 이 비어야 합니다."
